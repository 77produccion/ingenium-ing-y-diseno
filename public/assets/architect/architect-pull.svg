<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" fill="none" class="architect-asset-svg">
  <!--
    ARCHITECT VECTOR ASSET
    Asset Rig Structure:
    - #architect-root
      - #hand-grip (Grip point coordinate at 0, 150)
      - #arm-left / #arm-right
      - #torso
      - #head / #helmet
      - #leg-left / #leg-right
  -->
  <g id="architect-root">
    
    <!-- BACK LEG (Left Leg in depth) -->
    <g id="leg-left">
      <path d="M 152 195 L 195 265 L 210 335" stroke="#16223b" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 152 195 L 195 265 L 210 335" stroke="#253556" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Boot Left -->
      <path d="M 204 330 L 214 360 L 244 362 L 246 370 L 196 370 L 196 345 Z" fill="#151d1a" stroke="#1b2d52" stroke-width="2" />
      <path d="M 196 366 H 246" stroke="#eb7127" stroke-width="3" />
    </g>

    <!-- BACK ARM (Holding sheet edge) -->
    <g id="arm-left">
      <path d="M 135 118 L 78 136 L 14 150" stroke="#16223b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 135 118 L 78 136 L 14 150" stroke="#f6f3ec" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="14" cy="150" r="8" fill="#d9ad82" stroke="#16223b" stroke-width="2" />
    </g>

    <!-- TORSO & WORK WEAR -->
    <g id="torso">
      <!-- Work Shirt Layer -->
      <path d="M 120 102 L 148 198 L 116 202 L 94 108 Z" fill="#f6f3ec" stroke="#16223b" stroke-width="2.5" />
      <!-- High-Visibility Safety Vest -->
      <path d="M 118 103 L 146 196 L 104 200 L 92 107 Z" fill="#eb7127" stroke="#16223b" stroke-width="2" />
      <!-- Reflective Safety Bands -->
      <path d="M 98 134 L 136 128 M 104 166 L 142 160" stroke="#ffffff" stroke-width="5" stroke-linecap="square" />
      <path d="M 112 105 L 122 198" stroke="#16223b" stroke-width="1.5" />
      <!-- Work Belt & Pouch -->
      <rect x="104" y="194" width="46" height="9" rx="2" fill="#151d1a" stroke="#16223b" stroke-width="1" />
      <rect x="130" y="198" width="16" height="15" rx="2" fill="#5e7368" stroke="#16223b" stroke-width="1.5" />
    </g>

    <!-- FRONT LEG (Right Leg in tension) -->
    <g id="leg-right">
      <path d="M 120 198 L 88 268 L 122 342" stroke="#16223b" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 120 198 L 88 268 L 122 342" stroke="#1c2d4d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Boot Right -->
      <path d="M 116 338 L 126 366 L 158 368 L 160 376 L 110 376 L 110 352 Z" fill="#151d1a" stroke="#16223b" stroke-width="2" />
      <path d="M 110 372 H 160" stroke="#eb7127" stroke-width="3" />
    </g>

    <!-- HEAD & SAFETY HARDHAT -->
    <g id="head">
      <!-- Neck -->
      <path d="M 112 104 L 108 80 L 122 80 L 126 104 Z" fill="#d9ad82" stroke="#16223b" stroke-width="1.5" />
      <!-- Head Contour Looking Back (Left toward blueprint) -->
      <path d="M 94 65 C 92 48 106 42 120 44 C 134 46 138 58 136 72 C 134 82 118 86 104 84 L 96 78 Z" fill="#d9ad82" stroke="#16223b" stroke-width="2" />
      <!-- Profile Nose & Jaw -->
      <path d="M 95 62 L 87 64 L 94 70 L 93 76" stroke="#16223b" stroke-width="2" stroke-linejoin="round" />
      <!-- Focused Eye -->
      <circle cx="98" cy="58" r="2.5" fill="#16223b" />
      <path d="M 95 54 L 102 56" stroke="#16223b" stroke-width="1.5" />

      <!-- Helmet -->
      <g id="helmet">
        <path d="M 80 50 C 80 26 102 20 128 22 C 146 24 154 38 152 52 L 80 52 Z" fill="#faf8f4" stroke="#16223b" stroke-width="2.5" />
        <path d="M 72 52 H 158 C 158 52 154 56 144 56 H 80 Z" fill="#ebe6dc" stroke="#16223b" stroke-width="2" />
        <path d="M 108 22 C 108 32 109 46 109 50" stroke="#eb7127" stroke-width="3.5" stroke-linecap="round" />
      </g>
    </g>

    <!-- FRONT ARM & HAND GRIP (Main tension arm) -->
    <g id="arm-right">
      <path d="M 110 114 L 60 144 L 8 156" stroke="#16223b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 110 114 L 60 144 L 8 156" stroke="#eb7127" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- HAND GRIP POINT (Coordinates x:0, y:155) -->
    <g id="hand-grip">
      <circle cx="8" cy="156" r="9" fill="#d9ad82" stroke="#16223b" stroke-width="2.5" />
      <path d="M 2 150 C 9 148 13 156 9 162" stroke="#16223b" stroke-width="2.5" />
    </g>

  </g>
</svg>
